<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="light dark" />
        <title>__MSG_popupTitle__</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <!-- Active Jobposting Section -->
            <div id="jobposting-section" class="jobposting-section hidden">
                <div class="jobposting-header">
                    <span id="jobposting-status-led" class="status-led gray"></span>
                    <span id="jobposting-status-text" data-i18n="popupCurrentTabNoJobposting">__MSG_popupCurrentTabNoJobposting__</span>
                </div>

                 <div id="jobposting-current" class="jobposting-current hidden">
                    <span id="jobposting-current-kid" class="jobposting-kid-link" title="Click to open jobposting"></span>
                    <button type="button" id="set-active-jobposting-btn" class="btn-small">
                        __MSG_popupSetActiveJobposting__
                    </button>
                </div>

                <div id="jobposting-active" class="jobposting-active hidden">
                    <span>__MSG_popupActiveJobposting__: </span>
                    <strong id="jobposting-active-kid" class="jobposting-kid-link" title="Click to open jobposting"></strong>
                    <button type="button" id="clear-active-jobposting-btn" class="btn-small btn-link">
                        __MSG_popupClearActiveJobposting__
                    </button>
                </div>
            </div>

            <div id="portal-automation-section" class="portal-automation-section hidden">
                <div class="portal-automation-header">
                    <span class="status-led gray" id="portal-automation-led"></span>
                    <strong id="portal-automation-title">Portal</strong>
                </div>
                <div id="portal-automation-setup">
                    <label for="portal-automation-webhook">Message webhook</label>
                    <select id="portal-automation-webhook"></select>
                    <button type="button" id="start-portal-automation-btn" class="webhook-btn">Start automation</button>
                </div>
                <div id="portal-automation-status" class="hidden">
                    <div class="automation-status-header">
                        <span class="automation-status-badge" id="automation-status-badge">WAITING</span>
                        <span class="automation-progress-text" id="automation-progress-text">0 / 0</span>
                    </div>
                    <div class="automation-candidate-name" id="automation-candidate-name">No current candidate</div>
                    <div class="automation-progress">
                        <div class="automation-progress-bar" id="automation-progress-bar"></div>
                    </div>
                    <div class="automation-stats" id="automation-stats">
                        <span class="stat sent">Sent: 0</span>
                        <span class="stat failed">Failed: 0</span>
                    </div>
                    <div class="automation-error-alert hidden" id="automation-error-alert">
                        <span class="error-icon">⚠️</span>
                        <span class="error-text" id="automation-error-text"></span>
                    </div>
                    <div class="portal-automation-actions">
                        <button type="button" id="automation-continue-btn" class="btn-primary">Continue</button>
                        <button type="button" id="automation-retry-btn" class="btn-primary">Retry</button>
                        <button type="button" id="automation-reset-btn" class="btn-reset">Reset</button>
                        <button type="button" id="automation-stop-btn" class="btn-danger">Stop</button>
                    </div>
                </div>
            </div>

            <div id="status-message" class="hidden"></div>
            <div class="footer">
                <a href="#" id="open-options">__MSG_popupSettingsLink__</a>
            </div>
        </div>
        <script src="../utils/browser-polyfill.js"></script>
        <script src="../utils/utils.js"></script>
        <script src="../utils/jobposting.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
